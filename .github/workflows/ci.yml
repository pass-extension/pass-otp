name: Ubuntu

on: [push, pull_request, workflow_dispatch]

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:

      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shellcheck
        run: make lint

  check:
    runs-on: ubuntu-26.04
    steps:

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pass oathtool expect

      - name: Run the tests
        run: make test
