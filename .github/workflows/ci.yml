name: Ubuntu

on: [push, pull_request, workflow_dispatch]

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:

      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shellcheck
        run: make lint

  check:
    runs-on: ubuntu-26.04
    steps:

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pass oathtool expect kcov jq

      - name: Run the tests
        shell: bash
        run: make tests | tee "$RUNNER_TEMP/results.txt"

      - name: Coverage summary
        run: |
          {
            echo '### Test results'
            echo '```'
            grep -E '^(coverage|fixed|success|failed|broken|total)' "$RUNNER_TEMP/results.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
